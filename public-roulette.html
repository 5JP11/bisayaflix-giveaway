<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BisayaFlix - Live Roulette Giveaway</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #08090b; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; padding: 20px; }
        .wheel-container { position: relative; width: 90vw; max-width: 600px; height: 90vw; max-height: 600px; margin: 40px auto; filter: drop-shadow(0 0 30px rgba(0,0,0,0.8)); }
        #wheel-canvas { width: 100%; height: 100%; border-radius: 50%; border: 15px solid #1a1a1a; box-sizing: border-box; background: #111; }
        .pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 30px solid transparent; border-right: 30px solid transparent; border-top: 50px solid #e50914; z-index: 10; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
        .prize-info { text-align: center; margin-top: 20px; background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 400px; }
        #current-prize-display { font-size: 1.5rem; font-weight: 800; color: var(--primary-gold); margin-top: 10px; text-transform: uppercase; }
        .winner-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(10px); animation: fadeIn 0.5s ease; }
        .winner-card { text-align: center; transform: scale(0.5); animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes zoomIn { to { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <header class="logo-container">
        <img src="/Bisayaflix-logo.png" alt="BisayaFlix">
        <h1 style="font-size: 1.5rem; margin-top: 0.5rem;">Live Roulette Giveaway</h1>
    </header>

    <div class="page-with-sidebar">
        <!-- Left Sidebar: Prizes -->
        <aside class="sidebar-panel">
            <h2 class="sidebar-title">🎁 Prizes To Win</h2>
            <div style="margin-bottom: 20px; text-align: center;">
                <img src="/Giveaway.png" alt="Giveaway Prizes" style="width: 100%; border-radius: 12px; border: 1px solid var(--glass-border); box-shadow: var(--glow-gold);">
            </div>
            <div id="prizes-sidebar-list" class="sidebar-prizes-list">
                <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">Loading prizes...</p>
            </div>
        </aside>

        <!-- Center: Roulette Wheel -->
        <main style="display: flex; flex-direction: column; align-items: center;">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheel-canvas" width="800" height="800"></canvas>
            </div>

            <div class="prize-info">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <div id="sync-status" style="font-size: 0.6rem; color: #444; display: flex; align-items: center; gap: 5px;">
                        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #444;" id="sync-dot"></span>
                        SYNC OFFLINE
                    </div>
                    <div style="font-size: 0.7rem; color: var(--primary-gold); font-weight: 800;">
                        <span id="participant-count">0</span> PARTICIPANTS
                    </div>
                </div>
                <div style="font-size: 0.8rem; letter-spacing: 2px; color: var(--text-muted);">CURRENT PRIZE</div>
                <div id="current-prize-display">Waiting for Spin...</div>
            </div>
        </main>

        <!-- Right Sidebar: Winners Feed -->
        <aside class="sidebar-panel">
            <h2 class="sidebar-title">🏆 Recent Winners</h2>
            <div id="winners-feed" class="winners-feed" style="margin-top: 0; background: none; border: none; padding: 0;">
                <p style="text-align: center; color: var(--text-muted); padding: 1rem; font-size: 0.8rem;">Ready for the next winner!</p>
            </div>
        </aside>
    </div>

    <div id="winner-panel" class="winner-panel">
        <div class="winner-card">
            <h2 style="font-size: 2rem; color: var(--primary-gold);">🎉 WE HAVE A WINNER!</h2>
            <div id="winner-name-display" style="font-size: 4rem; font-weight: 900; margin: 20px 0;">JUAN DELA CRUZ</div>
            <p id="winner-prize-display" style="font-size: 1.5rem; color: white;">You won: <span style="font-weight: 800;">BisayaFlix Tshirt</span></p>
            <button onclick="closeWinner()" class="btn btn-primary" style="margin-top: 40px; width: auto; padding: 15px 40px;">Close</button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="sound-tick" src="https://assets.mixkit.co/active_storage/sfx/2042/2042-preview.mp3" preload="auto"></audio>
    <audio id="sound-win" src="https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { createClient } from '@supabase/supabase-js'
        import confetti from 'canvas-confetti'

        const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
        const supabaseAnonKey = import.meta.env.VITE_SUPABASE_ANON_KEY;
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const prizeDisplay = document.getElementById('current-prize-display');
        const winnerPanel = document.getElementById('winner-panel');
        const winnerNameText = document.getElementById('winner-name-display');
        const winnerPrizeText = document.getElementById('winner-prize-display');
        const soundTick = document.getElementById('sound-tick');
        const soundWin = document.getElementById('sound-win');

        let names = ["Join the Contest!"];
        let isSpinning = false;
        let rotation = 0;
        let targetAngle = 0;
        let spinStartTime = 0;
        const SPIN_DURATION = 8000; // 8 seconds
        let startRotation = 0;
        let totalRotation = 0;

        init();

        async function init() {
            console.log("🚀 Initializing Live Roulette...");
            if (!supabaseUrl || !supabaseAnonKey) {
                console.error("❌ CRITICAL: Supabase config missing! Check your Vercel Environment Variables or local .env file.");
                alert("Roulette System is not connected. Please check configuration.");
                return;
            }
            console.log("✅ Supabase Connected to:", supabaseUrl);
            
            // Critical Diagnostic: Check if giveaway_state has ID=1
            const { data: checkState, error: stateError } = await supabase.from('giveaway_state').select('*').eq('id', 1).single();
            if (stateError) {
                console.error("❌ GIVEAWAY_STATE ERROR: id=1 not found. This will prevent the wheel from spinning.", stateError.message);
                alert("Database state issue detected! ID=1 record is missing from giveaway_state.");
            } else {
                console.log("✅ Giveaway System Status:", checkState.is_spinning ? "SPINNING" : "READY");
            }

            await fetchRegistrants();
            await fetchRecentWinners();
            await fetchPrizes(); // NEW: Load prizes
            setupCanvas(canvas);
            drawWheel();
            listenForSpins();
            listenForPrizes(); // NEW: Realtime for prizes
            animate();
        }

        function setupCanvas(canvas) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            return ctx;
        }

        async function fetchRegistrants() {
            const { data, error } = await supabase.from('registrations').select('full_name').order('created_at', { ascending: false });
            if (error) console.error('Fetch Registrants Error:', error);
            if (data) {
                names = data.length > 0 ? data.map(r => r.full_name) : ["Join the Contest!"];
                updateParticipantUI();
            }
        }

        function updateParticipantUI() {
            const countEl = document.getElementById('participant-count');
            if (countEl) countEl.textContent = names[0] === "Join the Contest!" ? 0 : names.length;
        }

        function drawWheel() {
            if (!canvas || !ctx) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const radius = Math.min(centerX, centerY) - 10;
            const step = (Math.PI * 2) / names.length;

            ctx.clearRect(0, 0, rect.width, rect.height);

            names.forEach((name, i) => {
                const startAngle = rotation + i * step;
                const endAngle = startAngle + step;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = i % 2 === 0 ? '#1a1a1a' : '#111';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Name Rendering — geometry-based font size
                if (names.length < 300) {
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + step / 2);
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = i % 2 === 0 ? '#c5a059' : '#fff';
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 2;

                    // 1. Font size from arc height at mid-radius
                    const midR = radius * 0.65;
                    const arcHeight = 2 * midR * Math.sin(step / 2);
                    let fontSize = Math.min(9, Math.max(5, arcHeight * 0.38));

                    // 2. Split long names at word boundary
                    const cleanName = name.toUpperCase().trim();
                    const words = cleanName.split(' ');
                    let lines = [cleanName];
                    if (cleanName.length > 10 && words.length > 1) {
                        const mid = Math.ceil(words.length / 2);
                        lines = [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
                    }

                    // 3. Shrink width — text lives in outer 55% of radius
                    const textStartX = radius * 0.38;
                    const textMaxW = radius * 0.55;
                    ctx.font = `700 ${fontSize}px Inter`;
                    let maxMeasured = 0;
                    lines.forEach(l => { maxMeasured = Math.max(maxMeasured, ctx.measureText(l).width); });
                    if (maxMeasured > textMaxW) {
                        fontSize *= textMaxW / maxMeasured;
                        ctx.font = `700 ${fontSize}px Inter`;
                    }

                    // 4. Draw — hard-cap width via fillText maxWidth param
                    if (lines.length > 1) {
                        const gap = fontSize * 0.65;
                        ctx.fillText(lines[0], textStartX, -gap, textMaxW);
                        ctx.fillText(lines[1], textStartX, gap, textMaxW);
                    } else {
                        ctx.fillText(lines[0], textStartX, 0, textMaxW);
                    }

                    ctx.restore();
                }

            });

            // Draw Smooth Outer Ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#c5a059';
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        async function fetchPrizes() {
            const { data, error } = await supabase.from('prizes').select('*').order('name', { ascending: true });
            if (error) {
                console.error('Error fetching prizes:', error);
                return;
            }
            renderPrizes(data);
        }

        function renderPrizes(prizes) {
            const list = document.getElementById('prizes-sidebar-list');
            if (!list) return;

            if (prizes.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">Stay tuned for more prizes!</p>';
                return;
            }

            list.innerHTML = prizes.map(p => `
                <div class="sidebar-prize-item">
                    <span style="font-size: 1.2rem;">🎁</span>
                    <span>${p.name}</span>
                </div>
            `).join('');
        }

        function listenForPrizes() {
            supabase
                .channel('prizes-feed')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'prizes' }, () => {
                    fetchPrizes();
                })
                .subscribe();
        }

        function listenForSpins() {
            // 1. Listen for new registrations to keep names in sync
            supabase
                .channel('registrations-feed')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'registrations' }, payload => {
                    console.log("New registration received:", payload.new.full_name);
                    if (names[0] === "Join the Contest!") names = [];
                    names.unshift(payload.new.full_name);
                    updateParticipantUI();
                    drawWheel();
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'registrations' }, payload => {
                    console.log("Entry deleted. Refreshing list...");
                    fetchRegistrants().then(() => drawWheel());
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'registrations' }, payload => {
                    if (payload.eventType === 'DELETE' || payload.eventType === 'TRUNCATE') {
                        names = ["Join the Contest!"];
                        updateParticipantUI();
                        drawWheel();
                    }
                })
                .subscribe(status => {
                    const dot = document.getElementById('sync-dot');
                    const text = document.getElementById('sync-status');
                    if (status === 'SUBSCRIBED') {
                        dot.style.background = '#2ecc71';
                        text.innerHTML = '<span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71;"></span> SYNC LIVE';
                        text.style.color = '#2ecc71';
                    }
                });

            // 2. Listen for Admin "Spin" triggers
            supabase
                .channel('giveaway-control')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'giveaway_state' }, payload => {
                    const status = payload.new;
                    console.log("Spin Signal Received:", status);
                    if (status.is_spinning && !isSpinning) {
                        startSpin(status.current_prize, status.winner_name);
                    }
                })
                .subscribe();

            // 3. Listen for new winners
            supabase
                .channel('winners-feed')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'winners' }, payload => {
                    console.log("New winner announced (Live):", payload.new.winner_name);
                    renderWinnerItem(payload.new, true);
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'winners' }, () => {
                    fetchRecentWinners();
                })
                .subscribe();
        }

        let lastActionTime = Date.now();

        function startSpin(prize, winnerName) {
            fetchRegistrants().then(() => {
                isSpinning = true;
                spinStartTime = Date.now();
                startRotation = rotation % (Math.PI * 2);
                lastActionTime = Date.now();
                prizeDisplay.textContent = prize;
                
                const winnerIndex = names.indexOf(winnerName);
                if (winnerIndex !== -1) {
                    const segmentSize = (Math.PI * 2) / names.length;
                    
                    // Centering winner slice under pointer (1.5 * PI)
                    const winnerCenter = (winnerIndex * segmentSize) + (segmentSize / 2);
                    targetAngle = (Math.PI * 1.5) - winnerCenter;
                    
                    while (targetAngle < 0) targetAngle += Math.PI * 2;
                    targetAngle %= Math.PI * 2;

                    const extraSpins = 7 + Math.floor(Math.random() * 5);
                    let dist = targetAngle - startRotation;
                    while (dist < 0) dist += Math.PI * 2;
                    totalRotation = (extraSpins * Math.PI * 2) + dist;
                }
            });
        }

        function animate() {
            const now = Date.now();

            if (isSpinning) {
                const elapsed = now - spinStartTime;
                const progress = Math.min(elapsed / SPIN_DURATION, 1);
                
                // quintic out for much smoother, more physical deceleration
                const easeOutQuint = 1 - Math.pow(1 - progress, 5);
                
                rotation = startRotation + (totalRotation * easeOutQuint);

                const currentStep = Math.floor((rotation * names.length) / (Math.PI * 2));
                if (currentStep !== animate.lastStep) {
                    if (soundTick) {
                        soundTick.currentTime = 0;
                        // Fade out sound volume as it slows down
                        soundTick.volume = Math.max(0.1, 1 - progress);
                        soundTick.play().catch(() => {});
                    }
                    animate.lastStep = currentStep;
                }

                if (progress >= 1) {
                    isSpinning = false;
                    finalizeWinner();
                }
            } else {
                const idleSpeed = (now - lastActionTime > 10000) ? 0.01 : 0.002;
                rotation += idleSpeed;
            }

            drawWheel();
            requestAnimationFrame(animate);
        }

        async function finalizeWinner() {
            const { data } = await supabase.from('giveaway_state').select('*').eq('id', 1).single();
            winnerNameText.textContent = data.winner_name;
            winnerPrizeText.innerHTML = `You won: <span style="font-weight: 800;">${data.current_prize}</span>`;
            winnerPanel.style.display = 'flex';
            soundWin.play();
            confetti({
                particleCount: 200,
                spread: 100,
                origin: { y: 0.5 }
            });
        }

        async function fetchRecentWinners() {
            const { data, error } = await supabase.from('winners').select('*').order('created_at', { ascending: false }).limit(5);
            if (error) return;
            const feed = document.getElementById('winners-feed');
            if (!feed) return;
            feed.innerHTML = '';
            if (data.length === 0) {
                feed.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 1rem; font-size: 0.8rem;">Ready for the next winner!</p>';
                return;
            }
            data.forEach(w => renderWinnerItem(w));
        }

        function renderWinnerItem(w, isNew = false) {
            const feed = document.getElementById('winners-feed');
            if (!feed) return;
            const placeholder = feed.querySelector('p');
            if (placeholder && placeholder.textContent.includes("Ready")) feed.innerHTML = '';

            const item = document.createElement('div');
            item.className = 'winner-item';
            item.style.padding = '0.8rem';
            const time = new Date(w.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            item.innerHTML = `
                <div class="winner-info">
                    <span class="winner-name-text" style="font-size: 0.9rem;">${w.winner_name}</span>
                    <span class="winner-prize-text" style="font-size: 0.8rem;">${w.prize_won}</span>
                </div>
                <span class="winner-timestamp" style="font-size: 0.7rem;">${time}</span>
            `;

            if (isNew) feed.prepend(item);
            else feed.appendChild(item);
        }

        window.closeWinner = () => {
            winnerPanel.style.display = 'none';
        };

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BisayaFlix Admin - Giveaway Control</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #08090b; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .admin-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        select { width: 100%; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0,0,0,0.3); color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 1.1rem; appearance: none; cursor: pointer; }
        .spin-btn { width: 100%; background: linear-gradient(135deg, #e50914 0%, #b20710 100%); color: white; border: none; padding: 20px; border-radius: 12px; font-size: 1.5rem; font-weight: 800; cursor: pointer; border-bottom: 5px solid #8d060d; transition: all 0.2s; }
        .spin-btn:active { border-bottom: 0; transform: translateY(5px); }
        .status-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; background: rgba(255,255,255,0.1); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px; color: var(--primary-gold); }
        
        /* New Login Overlay */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-darker); z-index: 9999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        .login-box { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; border: 1px solid var(--glass-border); text-align: center; max-width: 400px; width: 90%; }
        .login-input { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); padding: 15px; border-radius: 12px; color: white; width: 100%; margin: 20px 0; font-size: 1rem; text-align: center; }
        
        /* Error Banner */
        #error-banner { display: none; background: rgba(229, 9, 20, 0.2); border: 1px solid var(--accent-red); color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color: var(--primary-gold); margin-bottom: 10px;">Admin Access</h2>
            <p style="font-size: 0.8rem; opacity: 0.7;">Please enter the management passkey</p>
            <input type="password" id="passkey-input" class="login-input" placeholder="Enter Passkey">
            <button id="login-btn" class="btn btn-primary">Unlock Dashboard</button>
        </div>
    </div>

    <div class="admin-card" style="max-width: 800px;">
        <div id="error-banner"></div>
        <div class="status-badge">Live Admin Dashboard</div>
        
        <!-- 1. Live Roulette at the Top -->
        <div class="wheel-section" style="text-align: center; margin-bottom: 30px;">
            <div class="wheel-container" style="position: relative; width: 100%; max-width: 400px; height: 400px; margin: 0 auto; overflow: hidden;">
                <div class="pointer" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #e50914; z-index: 10;"></div>
                <canvas id="wheel-canvas" width="800" height="800" style="width: 100%; height: 100%;"></canvas>
            </div>
            <div id="roulette-status" style="margin-top: 10px; font-weight: 700; color: var(--primary-gold); min-height: 24px;">
                Waiting for Spin...
            </div>
            
            <!-- Initialize Failsafe -->
            <div id="setup-alert" style="display: none; margin-top: 20px; padding: 15px; background: rgba(229, 9, 20, 0.2); border: 1px solid #e50914; border-radius: 10px; text-align: center;">
                <p style="color: #ff9999; margin-bottom: 10px; font-size: 0.9rem;">⚠️ Database record ID=1 is missing.</p>
                <button id="init-db-btn" class="btn btn-primary" style="padding: 8px 20px; font-size: 0.9rem;">FIX DATABASE NOW</button>
            </div>
        </div>

        <!-- 2. Controls in the Middle -->
        <div class="controls-section" style="padding: 20px; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">
            <h1>🎡 Giveaway Control</h1>
            <label style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-bottom: 5px;">SELECT PRIZE TO GIVE AWAY</label>
            <select id="prize-selector">
                <option value="BisayaFlix Varsity Jacket">BisayaFlix Varsity Jacket</option>
                <option value="BisayaFlix Tshirt">BisayaFlix Tshirt</option>
                <option value="Totebags">Totebags</option>
                <option value="BisayaFlix Pocketfans">BisayaFlix Pocketfans</option>
                <option value="BisayaFlix Sticker">BisayaFlix Sticker</option>
            </select>
            <button id="spin-btn" class="spin-btn">🎯 TRIGGER LIVE SPIN</button>
        </div>
        
        <!-- 3. Winners & Announcement at the Bottom -->
        <div id="admin-log" style="margin-top: 30px; font-size: 0.9rem; color: var(--text-muted); padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <div id="latest-winner-announcement" style="text-align: center; margin-bottom: 20px; display: none;">
                <h2 style="color: var(--primary-gold); margin-bottom: 0;">🎉 RECENT WINNER!</h2>
                <div id="winner-name-highlight" style="font-size: 2.5rem; font-weight: 900; color: white;">---</div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <p style="margin: 0;"><strong>Recent Winners Log:</strong></p>
                <button id="clear-winners-btn" class="btn btn-outline" style="width: auto; padding: 5px 12px; font-size: 0.7rem; border-color: rgba(255,255,255,0.2);">Clear Winners</button>
            </div>
            <ul id="winners-list" style="list-style: none; padding: 0; margin-top: 10px; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 10px;"></ul>
            
            <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); text-align: center;">
                <p style="font-size: 0.7rem; color: #666; margin-bottom: 10px;">DANGER ZONE: CLEARS SUPABASE DATABASE ENTIRELY</p>
                <button id="wipe-data-btn" class="btn btn-outline" style="border-color: #444; color: #666; width: auto; padding: 8px 15px; font-size: 0.75rem;">Wipe All Registrants</button>
            </div>
        </div>
    </div>

    <!-- Audio for Admin Feedback -->
    <audio id="sound-tick" src="https://assets.mixkit.co/active_storage/sfx/2042/2042-preview.mp3" preload="auto"></audio>
    <audio id="sound-win" src="https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { createClient } from '@supabase/supabase-js'
        
        console.log("🛠️ Admin script module loaded.");
        
        const loginOverlay = document.getElementById('login-overlay');
        const loginInput = document.getElementById('passkey-input');
        const loginBtn = document.getElementById('login-btn');
        const errorBanner = document.getElementById('error-banner');

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.style.display = 'block';
            console.error("Dashboard Error:", msg);
        }

        // Check for session
        if (sessionStorage.getItem('admin_auth') === 'true') {
            loginOverlay.style.display = 'none';
        }

        loginBtn.addEventListener('click', () => {
            if (loginInput.value === 'bisaya123') {
                sessionStorage.setItem('admin_auth', 'true');
                loginOverlay.style.fadeOut = "0.3s";
                setTimeout(() => loginOverlay.style.display = 'none', 300);
                init();
            } else {
                alert("Incorrect passkey.");
            }
        });

        loginInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        let supabase;
        const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
        const supabaseAnonKey = import.meta.env.VITE_SUPABASE_ANON_KEY; 

        try {
            if (!supabaseUrl || !supabaseAnonKey) {
                showError("⚠️ Supabase API config missing. Check your Environment Variables.");
            } else {
                supabase = createClient(supabaseUrl, supabaseAnonKey);
                console.log("🔗 Supabase Client initialized.");
            }
        } catch (e) {
            showError("❌ Failed to connect to Supabase: " + e.message);
        }
        const spinBtn = document.getElementById('spin-btn');
        const prizeSelector = document.getElementById('prize-selector');
        const winnersList = document.getElementById('winners-list');
        const winnerHighlight = document.getElementById('winner-name-highlight');
        const announcement = document.getElementById('latest-winner-announcement');

        // Roulette Canvas Logic
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const soundTick = document.getElementById('sound-tick');
        const soundWin = document.getElementById('sound-win');
        const rouletteStatus = document.getElementById('roulette-status');

        let names = ["Join the Contest!"];
        let isSpinning = false;
        let rotation = 0;
        let targetAngle = 0;
        let spinStartTime = 0;
        const SPIN_DURATION = 8000; // 8 seconds
        let startRotation = 0;
        let totalRotation = 0;

        init();

        async function init() {
            if (sessionStorage.getItem('admin_auth') !== 'true') return;
            
            console.log("🚀 Initializing Admin Control...");
            if (!supabase) return;

            const { data: checkState, error: stateError } = await supabase.from('giveaway_state').select('*').eq('id', 1).single();
            
            if (stateError) {
                if (stateError.code === 'PGRST116' || stateError.code === '42P01') {
                    showError("❌ Database table 'giveaway_state' not found. Please run schema.sql in Supabase.");
                    document.getElementById('setup-alert').style.display = 'block';
                    document.getElementById('init-db-btn').addEventListener('click', initializeSystem);
                } else {
                    showError("Database Error: " + stateError.message);
                }
            } 

            await fetchRegistrants();
            await fetchWinners();
            setupCanvas(canvas);
            drawWheel();
            animate();
            listenForSpins();
        }

        function setupCanvas(canvas) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            return ctx;
        }

        async function fetchWinners() {
            const { data, error } = await supabase.from('winners').select('*').order('created_at', { ascending: false });
            if (error) {
                console.warn('Winners table might not exist yet.');
                return;
            }
            winnersList.innerHTML = '';
            data.forEach(displayWinner);
        }

        function displayWinner(w) {
            const li = document.createElement('li');
            li.style.cssText = "padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #fff; font-size: 0.85rem;";
            const time = new Date(w.created_at).toLocaleTimeString();
            li.innerHTML = `<span style="color:#666; font-size: 0.7rem;">[${time}]</span> <strong style="color:var(--primary-gold);">${w.winner_name}</strong> won a <strong>${w.prize_won}</strong>`;
            winnersList.appendChild(li);
        }

        async function initializeSystem() {
            const btn = document.getElementById('init-db-btn');
            btn.disabled = true;
            btn.textContent = "Fixing...";
            
            const { error } = await supabase.from('giveaway_state').insert([
                { id: 1, is_spinning: false, current_prize: 'None', winner_name: 'None' }
            ]);

            if (error) {
                alert("Error fixing database: " + error.message);
                btn.disabled = false;
            } else {
                alert("✅ Database fixed! Refreshing page...");
                location.reload();
            }
        }

        async function fetchRegistrants() {
            const { data, error } = await supabase.from('registrations').select('full_name').order('created_at', { ascending: false });
            if (error) console.error('Fetch Registrants Error (Admin):', error);
            if (data && data.length > 0) names = data.map(r => r.full_name);
        }

        function drawWheel() {
            if (!canvas || !ctx) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const radius = Math.min(centerX, centerY) - 10;
            const step = (Math.PI * 2) / names.length;

            ctx.clearRect(0, 0, rect.width, rect.height);

            names.forEach((name, i) => {
                const startAngle = rotation + i * step;
                const endAngle = startAngle + step;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = i % 2 === 0 ? '#1a1a1a' : '#111';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.stroke();

                if (names.length < 60) {
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + step / 2);
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = i % 2 === 0 ? '#c5a059' : '#fff';
                    
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 2;
                    
                    ctx.font = `800 ${Math.max(12, 24 - names.length/5)}px Inter`;
                    ctx.fillText(name.toUpperCase().substring(0, 12), radius - 30, 0);
                    ctx.restore();
                }
            });

            // Draw Smooth Outer Ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#c5a059';
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        let lastActionTime = Date.now();

        function animate() {
            const now = Date.now();
            if (isSpinning) {
                const elapsed = now - spinStartTime;
                const progress = Math.min(elapsed / SPIN_DURATION, 1);
                
                // quintic out for much smoother, more physical deceleration
                const easeOutQuint = 1 - Math.pow(1 - progress, 5);
                
                rotation = startRotation + (totalRotation * easeOutQuint);

                const currentStep = Math.floor((rotation * names.length) / (Math.PI * 2));
                if (currentStep !== animate.lastStep) {
                    if (soundTick) {
                        soundTick.currentTime = 0;
                        // Fade out sound volume as it slows down
                        soundTick.volume = Math.max(0.1, 1 - progress);
                        soundTick.play().catch(() => {});
                    }
                    animate.lastStep = currentStep;
                }

                if (progress >= 1) {
                    isSpinning = false;
                    if (soundWin) soundWin.play();
                }
            } else {
                const idleSpeed = (now - lastActionTime > 10000) ? 0.01 : 0.002;
                rotation += idleSpeed;
            }
            drawWheel();
            requestAnimationFrame(animate);
        }

        function listenForSpins() {
            supabase.channel('registrations-feed').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'registrations' }, payload => {
                console.log("New registration received (Admin):", payload.new.full_name);
                if (names[0] === "Join the Contest!") names = [];
                names.unshift(payload.new.full_name);
                drawWheel();
            }).on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'registrations' }, () => {
                fetchRegistrants().then(() => drawWheel());
            }).on('postgres_changes', { event: '*', schema: 'public', table: 'registrations' }, payload => {
                if (payload.eventType === 'DELETE' || payload.eventType === 'TRUNCATE') {
                    names = ["Join the Contest!"];
                    winnersList.innerHTML = '';
                    drawWheel();
                }
            }).subscribe();

            supabase.channel('giveaway-control').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'giveaway_state' }, payload => {
                const status = payload.new;
                
                if (status.is_spinning && !isSpinning) {
                    startSpinUI(status.winner_name, status.current_prize);
                } else if (!status.is_spinning && isSpinning) {
                    winnerHighlight.textContent = status.winner_name;
                    announcement.style.display = 'block';
                    rouletteStatus.textContent = "Spin Complete!";
                    fetchWinners();
                }
            }).subscribe();
        }

        function startSpinUI(winnerName, prize) {
            isSpinning = true;
            spinStartTime = Date.now();
            startRotation = rotation % (Math.PI * 2);
            rouletteStatus.textContent = `🎰 SPINNING FOR: ${prize}`;
            
            const winnerIndex = names.indexOf(winnerName);
            if (winnerIndex !== -1) {
                const step = (Math.PI * 2) / names.length;
                
                // Centering winner slice under pointer (1.5 * PI)
                const winnerCenter = (winnerIndex * step) + (step / 2);
                targetAngle = (Math.PI * 1.5) - winnerCenter;
                
                while (targetAngle < 0) targetAngle += Math.PI * 2;
                targetAngle %= Math.PI * 2;

                const extraSpins = 7 + Math.floor(Math.random() * 5);
                let dist = targetAngle - startRotation;
                while (dist < 0) dist += Math.PI * 2;
                totalRotation = (extraSpins * Math.PI * 2) + dist;
            }
        }

        spinBtn.addEventListener('click', async () => {
            const prize = prizeSelector.value;
            spinBtn.disabled = true;
            spinBtn.textContent = "⚡ TRIGGERING LIVE SPIN...";

            const { data: registrants, error } = await supabase.from('registrations').select('full_name');
            if (error || !registrants.length) {
                spinBtn.disabled = false;
                spinBtn.textContent = "🎯 TRIGGER LIVE SPIN";
                return alert("No entrants!");
            }
            
            const winner = registrants[Math.floor(Math.random() * registrants.length)];

            // Save winner to persistent log
            await supabase.from('winners').insert([{ winner_name: winner.full_name, prize_won: prize }]);

            // Transmit to Public view
            await supabase.from('giveaway_state').update({ 
                is_spinning: true, 
                current_prize: prize,
                winner_name: winner.full_name,
                last_updated: new Date().toISOString()
            }).eq('id', 1);

            setTimeout(async () => {
                spinBtn.disabled = false;
                spinBtn.textContent = "🎯 TRIGGER LIVE SPIN";
                await supabase.from('giveaway_state').update({ is_spinning: false }).eq('id', 1);
            }, SPIN_DURATION); 
        });

        // Clear Winners Log
        document.getElementById('clear-winners-btn').addEventListener('click', async () => {
            if (!confirm("Clear all winners from the database?")) return;
            const btn = document.getElementById('clear-winners-btn');
            btn.textContent = "Clearing...";
            btn.disabled = true;
            
            const { error } = await supabase.from('winners').delete().not('id', 'is', null);
            
            if (error) {
                alert("Error clearing winners: " + error.message);
            } else {
                fetchWinners();
                alert("✅ Winners list cleared.");
            }
            btn.textContent = "Clear Winners";
            btn.disabled = false;
        });

        // Wipe Data Logic
        const wipeBtn = document.getElementById('wipe-data-btn');
        wipeBtn.addEventListener('click', async () => {
            const confirmed = window.confirm("⚠️ DANGER: This will PERMANENTLY DELETE ALL registered participants. Continue?");
            if (!confirmed) return;
            
            const secondConfirm = window.confirm("ARE YOU 100% SURE? (Think about the Google Sheets sync too!)");
            if (!secondConfirm) return;

            wipeBtn.disabled = true;
            wipeBtn.textContent = "Wiping Database...";
            
            // Delete all records where ID is not null (effectively all)
            const { error } = await supabase.from('registrations').delete().not('id', 'is', null);
            
            if (error) {
                console.error("Wipe error:", error);
                alert("Error wiping data: " + error.message);
                wipeBtn.disabled = false;
                wipeBtn.textContent = "Wipe All Registrants";
            } else {
                alert("✅ All participants cleared successfully.");
                location.reload();
            }
        });

    </script>
</body>
</html>
